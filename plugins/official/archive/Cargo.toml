[package]
name="fiex-plugin-archive"
version="0.1.0"
edition="2021"
rust-version="1.90"
[dependencies]
fiex-plugin-sdk = { git = "https://github.com/kevinhuang001/flex-sdk.git", rev = "4d4bc1f1b1fc911d923b636433457a7731ef0b1b" }
serde_json="1"
globset="0.4"
zip={version="4",default-features=false,features=["deflate","bzip2","zstd","aes-crypto"]}
tar="0.4"
flate2="1"
bzip2="0.6"
xz2={version="0.1",features=["static"]}
sevenz-rust2="0.20"
tempfile="3"
