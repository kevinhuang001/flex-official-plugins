<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <style>
    :root {
      font:
        13px -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      color: #29313a;
      background: #fafbfc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 16px;
    }
    label {
      display: grid;
      grid-template-columns: 115px 1fr;
      align-items: center;
      gap: 12px;
      margin: 13px 0;
    }
    select,
    input {
      width: 100%;
      border: 1px solid #d8dce3;
      background: #fff;
      border-radius: 9px;
      padding: 8px 10px;
      color: #29313a;
    }
    input:focus,
    select:focus {
      outline: 2px solid #98b8ef;
    }
    .note {
      color: #7d8792;
      font-size: 11px;
      line-height: 1.6;
      margin: 18px 0;
    }
    footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid #e8ebef;
      padding-top: 17px;
      margin-top: 16px;
    }
    button {
      border-radius: 9px;
      padding: 9px 18px;
      border: 1px solid #d9dee6;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: #427acb;
      color: white;
      border-color: #427acb;
    }
    button:disabled {
      opacity: 0.4;
      cursor: wait;
    }
    #result {
      color: #bd514a;
      min-height: 25px;
      white-space: pre-wrap;
      font-size: 11px;
    }
  </style>
  <body>
    <h2>高级压缩</h2>
    <form id="form">
      <label
        >压缩格式
        <select name="format">
          <option value="zip">ZIP</option>
          <option value="7z">7z</option>
          <option value="tar.gz">TAR.GZ</option>
          <option value="tar.bz2">TAR.BZ2</option>
          <option value="tar.xz">TAR.XZ</option>
          <option value="tar">TAR</option>
        </select></label
      >
      <label>压缩级别 <input name="level" type="range" min="0" max="9" value="6" /></label>
      <label
        >ZIP 密码
        <input name="password" type="password" autocomplete="off" placeholder="不设置则不加密"
      /></label>
      <label
        >包含所有文件 <input name="full" type="checkbox" style="width: 16px; height: 16px"
      /></label>
      <p class="note">
        文件选择器由 Fiex 提供。插件只会收到你确认的保存位置，不会取得整个目录的额外访问权限。
      </p>
      <div id="result" role="alert"></div>
      <footer>
        <button id="cancel" type="button">取消</button
        ><button class="primary" id="submit" type="submit">选择位置并压缩</button>
      </footer>
    </form>
    <script>
      ;(function () {
        let port = null,
          sessionId = '',
          next = 0
        const pending = new Map()
        window.addEventListener('message', (event) => {
          if (event.data?.type !== 'fiex.bridge.init' || !event.ports?.[0]) return
          sessionId = event.data.sessionId
          port = event.ports[0]
          port.onmessage = (e) => {
            const m = e.data
            if (m?.type !== 'response') return
            const h = pending.get(m.requestId)
            if (!h) return
            pending.delete(m.requestId)
            m.error ? h.reject(Error(m.error.message)) : h.resolve(m.result)
          }
          port.start()
          port.postMessage({
            type: 'fiex.bridge.ready',
            bridgeVersion: '1.0',
            sessionId,
            nonce: event.data.nonce,
          })
        })
        function request(method, params) {
          return new Promise((resolve, reject) => {
            if (!port) {
              reject(Error('Fiex Bridge 尚未初始化'))
              return
            }
            const requestId = 'ui-' + ++next
            pending.set(requestId, { resolve, reject })
            port.postMessage({
              type: 'request',
              bridgeVersion: '1.0',
              sessionId,
              requestId,
              method,
              params,
            })
          })
        }
        document.getElementById('cancel').onclick = () => request('panel.close').catch(() => {})
        document.getElementById('form').onsubmit = async (e) => {
          e.preventDefault()
          const button = document.getElementById('submit')
          button.disabled = true
          try {
            const form = new FormData(e.currentTarget),
              context = await request('context.get')
            const format = String(form.get('format')),
              extension = format === 'tar' ? 'tar' : format
            const name = 'Archive.' + extension
            const destination = await request('dialog.saveFile', {
              title: '选择压缩文件位置',
              directory: context.directory,
              suggestedName: name,
              extensions: [extension.split('.').pop()],
            })
            if (!destination) return
            await request('plugin.invoke', {
              method: 'archive.compress',
              params: {
                paths: context.selection,
                destination,
                format,
                ignores: [],
                level: Number(form.get('level')),
                password: String(form.get('password') || '') || null,
              },
            })
            await request('panel.close')
          } catch (error) {
            document.getElementById('result').textContent = String(error.message || error)
          } finally {
            button.disabled = false
          }
        }
      })()
    </script>
  </body>
</html>
