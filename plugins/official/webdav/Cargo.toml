[package]
name = "fiex-plugin-webdav"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
fiex-plugin-sdk = { git = "https://github.com/kevinhuang001/flex-sdk.git", rev = "4d4bc1f1b1fc911d923b636433457a7731ef0b1b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt","time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","stream"] }
quick-xml = "0.37"
urlencoding = "2"
httpdate = "1"
futures-util = "0.3"
base64 = "0.22"
